name: 앱 파일 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 앱 주소 넣기
        working-directory: android
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          sed -i "s|REPLACE_OWNER|${OWNER,,}|g; s|REPLACE_REPO|${REPO}|g" \
            app/src/main/java/kr/jion/day/MainActivity.kt
          grep -n "APP_URL" app/src/main/java/kr/jion/day/MainActivity.kt

      - name: APK 만들기
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: jion-day-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 예전 앱 파일 치우기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api /repos/${GITHUB_REPOSITORY}/releases/tags/latest --jq '.assets[] | select(.name != "app-release.apk") | .id' 2>/dev/null || true)
          for id in $ids; do
            echo "deleting asset $id"
            gh api -X DELETE /repos/${GITHUB_REPOSITORY}/releases/assets/$id || true
          done

      - name: 내려받기 쉽게 릴리스로 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 지온의 하루 앱
          body: 태블릿에서 아래 apk 파일을 눌러 설치하세요.
          files: android/app/build/outputs/apk/release/*.apk
          make_latest: true
