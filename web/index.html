<html lang="ko">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,collection,setDoc,deleteDoc,getDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FF; --surface:#FFFFFF; --ink:#1A2140; --muted:#5C6690; --line:#DDE3F5; --soft:#E8EDFF;
  --primary:#3552D6; --on-primary:#FFFFFF;
  --mission:#E4572E; --praise:#D99200; --book:#238A5B;
  --font-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r:16px; --veil:rgba(243,246,255,.60);
  /* layout: one column on phones, hero + checklist side by side on tablets, tab bar at the bottom */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12172B; --surface:#1B2240; --ink:#EEF1FF; --muted:#A3ACD0; --line:#2C3560; --soft:#232C55;
    --primary:#8EA2FF; --on-primary:#10163A; --veil:rgba(18,23,43,.74); --mission:#FF8A65; --praise:#FFC93C; --book:#5FD6A0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12172B; --surface:#1B2240; --ink:#EEF1FF; --muted:#A3ACD0; --line:#2C3560; --soft:#232C55;
  --primary:#8EA2FF; --on-primary:#10163A; --veil:rgba(18,23,43,.74); --mission:#FF8A65; --praise:#FFC93C; --book:#5FD6A0;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:24px}
h3{font-size:19px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:900px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-size:26px;white-space:nowrap}
.top .row{gap:8px}
.top .pill{padding:6px 12px;font-size:15px}
.top{flex-wrap:wrap}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500;min-height:44px}
.pill.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.stack>*{min-width:0}
.home>*{min-width:0}
.grow{min-width:0}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.home{display:grid;gap:14px}
@media (min-width:760px){.home{grid-template-columns:300px 1fr;align-items:start}}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.slot{position:relative;width:116px;height:174px;border:2px solid var(--line);border-radius:16px;display:grid;place-items:center;background:#FBF7F1;overflow:hidden}
.slot.lg{width:140px;height:210px}
.slot>img{width:100%;height:100%;object-fit:contain;padding:24px 20px 6px;transform-origin:50% 100%;animation:idle 3.4s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.014)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.slot>img,.f-pet{animation:none}}
.fl{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.fl img{width:88%;height:88%;object-fit:contain}
.f-hat{left:4px;top:4px}.f-gl{right:4px;top:4px}.f-acc{left:4px;top:42%}.f-cl{right:4px;top:42%}.f-sh{left:4px;bottom:4px}
.f-pet{right:4px;bottom:4px;width:34px;height:34px;font-size:20px;animation:hop 2.4s ease-in-out infinite}
.doll{width:100%;height:100%;box-sizing:border-box;padding:20px 6px 2px;transform-origin:50% 100%;animation:idle 3.4s ease-in-out infinite}
.doll .armL{animation:sway 4s ease-in-out infinite;transform:rotate(6deg)}
.doll .armR{animation:wave 9s ease-in-out infinite;transform:rotate(-6deg)}
.doll .head{animation:nod 6s ease-in-out infinite;transform-origin:60px 70px}
.doll .blink{animation:blink 4.5s infinite}
.doll .m1{animation:mA 7s infinite}.doll .m2{animation:mB 7s infinite}.doll .brow{animation:brow 7s infinite}
.doll .foot{animation:tap 5s infinite}.doll g:last-child>.foot{animation-delay:.5s}
@keyframes sway{0%,100%{transform:rotate(6deg)}50%{transform:rotate(10deg)}}
@keyframes wave{0%,62%,100%{transform:rotate(-6deg)}68%,80%{transform:rotate(-135deg)}74%,86%{transform:rotate(-108deg)}92%{transform:rotate(-6deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(1.8deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes mA{0%,38%,60%,100%{opacity:1}42%,56%{opacity:0}}
@keyframes mB{0%,38%,60%,100%{opacity:0}42%,56%{opacity:1}}
@keyframes brow{0%,38%,60%,100%{transform:translateY(0)}42%,56%{transform:translateY(-1.6px)}}
@keyframes tap{0%,80%,100%{transform:translateY(0)}86%{transform:translateY(-3px)}92%{transform:translateY(0)}96%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.doll,.doll *{animation:none!important}}
.f-pet.pdog{background:none;box-shadow:none;width:50px;height:50px;right:0;bottom:0}
.maru{width:100%;height:100%;overflow:visible}.item .e .maru{width:40px;height:40px}
.maru .mtail{animation:wag .5s ease-in-out infinite alternate;transform-origin:46px 48px}
.maru .mear{animation:flop 3s ease-in-out infinite;transform-origin:20px 22px}.maru .mear2{animation:flop 3s ease-in-out infinite .4s;transform-origin:44px 22px}
.maru .mblink{animation:blink 4.2s infinite;transform-origin:32px 25px}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes flop{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.maru *{animation:none!important}}
.slot.art{place-items:unset}
.jp,.mp{position:absolute}
.jp{left:8%;right:8%;top:26px;height:68%}
.slot.lg .jp{top:30px}
.mp{right:2px;bottom:3px;width:50%;height:36%}
.jp img,.mp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;animation:cyc calc(var(--t)*6) infinite;animation-delay:calc(var(--i)*var(--t))}
.jp img{object-position:50% 0}.mp img{object-position:100% 100%}
.mp.one img{opacity:1;animation:none}
@keyframes cyc{0%{opacity:0;transform:scale(.96)}2.5%{opacity:1;transform:scale(1)}16.5%{opacity:1}19%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.jp img,.mp img{animation:none}.jp img:first-child,.mp img:first-child{opacity:1}}
select{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);width:100%}
.msgcard{border:2px solid var(--praise);background:color-mix(in srgb,var(--praise) 10%,var(--surface))}
.msgtext{margin:0;font-family:var(--font-display);font-size:24px;line-height:1.45;white-space:pre-wrap}
.pad .msgtext{font-size:32px}
.ytwrap{position:relative;width:100%;aspect-ratio:16/9;margin-top:10px;border-radius:14px;overflow:hidden;background:#000}
.ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
audio{width:100%;margin-top:8px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);border-radius:14px;min-height:52px}
.prow.on{opacity:.55}
.prow.on .t{text-decoration:line-through}
.prow .t{flex:1;font-size:16px;overflow-wrap:anywhere}
.pchk{all:unset;cursor:pointer;display:grid;place-items:center;flex:none}
.pchk .box{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--surface)}
.pchk .box svg{width:18px;height:18px;opacity:0}
.prow.on .pchk .box{background:var(--primary);border-color:var(--primary)}
.prow.on .pchk .box svg{opacity:1;color:#fff}
.who{font-size:12px;font-weight:700;border-radius:8px;padding:2px 7px;flex:none;border:1.5px solid}
.w-both{color:var(--muted);border-color:var(--line)}
.w-mom{color:var(--praise);border-color:var(--praise)}
.w-dad{color:var(--book);border-color:var(--book)}
.px{all:unset;cursor:pointer;color:var(--muted);font-size:16px;padding:6px 4px;flex:none;min-width:28px;text-align:center}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.picks>*{min-width:0}
.pickbox{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px solid var(--book);border-radius:16px;padding:12px 10px;background:color-mix(in srgb,var(--book) 7%,var(--surface));cursor:pointer}
.pickbox.empty-pick{border-style:dashed;border-color:var(--line);background:none;cursor:default}
.pickbox .pk{font-family:var(--font-display);color:var(--book);font-size:16px}
.pickbox img{width:84px;height:112px;object-fit:cover;border-radius:10px}
.pickbox b{font-size:16px;line-height:1.3}
.chip.pick{background:color-mix(in srgb,var(--book) 16%,var(--surface));border-color:var(--book);color:var(--book);font-weight:700}
input[type=search]{font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);min-height:48px}
.sch{display:flex;align-items:center;gap:12px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;min-height:52px;font-size:17px}
.sch .tm{font-weight:700;color:var(--muted);min-width:82px;font-size:15px}
.sch .t{font-weight:500;flex:1}
.sch.next{border-color:var(--primary);background:var(--soft)}
.sch.next .tm{color:var(--primary)}
.sch.past{opacity:.5}
.pad .sch{font-size:24px;min-height:72px}.pad .sch .tm{font-size:20px;min-width:110px}
.camwrap video{width:100%;max-height:300px;border-radius:12px;background:#000;object-fit:contain;display:block}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.task.sm{min-height:52px;font-size:17px;padding:10px 14px;gap:10px}
.task.sm .box{width:28px;height:28px;border-radius:8px;border-width:2px}
.task.sm .box svg{width:18px;height:18px}
.tbig{font-family:var(--font-display);font-size:60px;text-align:center;margin:4px 0 10px;font-variant-numeric:tabular-nums;letter-spacing:2px}
.saybox{position:relative;display:block;width:fit-content;max-width:100%;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:7px 11px;font-size:15px;margin-bottom:8px}
.saybox:after{content:'';position:absolute;left:14px;bottom:-8px;width:12px;height:12px;background:var(--soft);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.tricks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tricks>*{min-width:0}
.trick{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:13px;font-weight:700;background:var(--surface)}
.trick img{width:52px;height:52px;object-fit:contain}
.trick.off{opacity:.55;cursor:default;background:none}
.trick .lk{font-size:26px;height:52px;display:grid;place-items:center}
.trick .need{font-size:11px;font-weight:500;color:var(--muted)}
.eat{position:relative;width:170px;height:170px;margin:0 auto}
.eat img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;animation:eatseq 2.4s ease-in-out forwards;animation-delay:calc(var(--i)*.55s)}
.eat img:last-of-type{animation:eatlast 1s ease-in-out forwards;animation-delay:1.65s}
@keyframes eatseq{0%{opacity:0}8%{opacity:1}45%{opacity:1}55%{opacity:0}100%{opacity:0}}
@keyframes eatlast{0%{opacity:0}20%{opacity:1}100%{opacity:1}}
.eat .bite{position:absolute;left:50%;top:38%;font-size:34px;transform:translate(-50%,0);animation:bite 1.7s ease-in forwards}
@keyframes bite{0%{opacity:0;transform:translate(-50%,-40px) scale(1)}25%{opacity:1;transform:translate(-50%,0) scale(1)}70%{opacity:1;transform:translate(-50%,6px) scale(.55)}100%{opacity:0;transform:translate(-50%,10px) scale(.2)}}
.t-sit{animation:tsit 1.1s ease-in-out 2}
@keyframes tsit{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.t-down{animation:tdown 1.4s ease-in-out 2}
@keyframes tdown{0%,100%{transform:translateY(-10px) scaleY(1)}50%{transform:translateY(8px) scaleY(.88)}}
.t-ball{animation:tball .5s ease-in-out 5}
@keyframes tball{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.t-wait{animation:twait 1.6s ease-in-out 2}
@keyframes twait{0%,100%{transform:rotate(0)}40%{transform:rotate(-9deg)}70%{transform:rotate(6deg)}}
.t-play{animation:tplay 2s ease-in-out 1}
@keyframes tplay{0%{transform:scale(1)}50%{transform:scale(.95) translateY(8px)}100%{transform:scale(1)}}
.t-spin{animation:tspin 1.3s ease-in-out 2}
@keyframes tspin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.eat img,.eat .bite,.stamp-pop .stk{animation:none!important;opacity:1}}
.petbox{display:flex;gap:12px;align-items:center}
.petbox img{width:96px;height:96px;object-fit:contain;flex:none}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(92px,100%),1fr));gap:8px}
.gi{position:relative;padding:0;border:2px solid var(--line);border-radius:12px;background:var(--soft);aspect-ratio:1;overflow:hidden;display:grid;place-items:center}
.gi img{width:100%;height:100%;object-fit:cover}
.gi .note{font-size:13px;padding:6px;text-align:center;color:var(--muted);overflow:hidden}
.gi .dd{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:8px;padding:1px 6px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(min(120px,100%),1fr))}
.grid.sm .bcard .thumb{aspect-ratio:3/4}
.lb{position:fixed;inset:0;background:rgba(8,10,25,.9);z-index:40;display:grid;place-items:center;padding:16px;overflow:auto}
.lbin{max-width:min(92vw,720px);text-align:center;display:grid;gap:10px}
.lb img{max-width:100%;max-height:72vh;border-radius:14px;background:#fff}
.lb p{color:#fff;margin:0;font-size:17px}
.pimg{width:38px;height:38px;object-fit:contain}
.dictbg{background-size:cover;background-position:center;border-radius:16px}
.sw{display:block;width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}
#mcv{width:100%;height:auto;touch-action:none;border-radius:12px;display:block;background:var(--soft)}
.mcol{width:48px;height:48px;border-radius:50%;border:3px solid var(--line);padding:0}
.mcol.on{border-color:var(--ink)}
.lv{position:absolute;left:50%;top:4px;transform:translateX(-50%);background:var(--primary);color:var(--on-primary);font-family:var(--font-display);font-size:13px;border-radius:999px;padding:0 8px;white-space:nowrap}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:14px}
.task{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:64px;font-size:19px;font-weight:500}
.task .box{width:34px;height:34px;border-radius:10px;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.task.on{border-color:var(--mission);background:color-mix(in srgb,var(--mission) 10%,var(--surface))}
.task.on .box{background:var(--mission);border-color:var(--mission);color:#fff}
.task.on span.t{text-decoration:line-through;text-decoration-thickness:2px;opacity:.7}
.stamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stamps>*{min-width:0}
.stamp b{font-size:clamp(20px,6vw,26px)}
.stamp .small{font-size:clamp(11px,3.2vw,13px);white-space:nowrap}
.stamp svg{width:clamp(30px,9vw,40px);height:clamp(30px,9vw,40px)}
.stamp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px}
.stamp svg{width:48px;height:48px}
.stamp b{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.1}
.s-mission{color:var(--mission)}.s-praise{color:var(--praise)}.s-book{color:var(--book)}
.done-banner{display:flex;align-items:center;gap:12px;color:var(--mission);font-family:var(--font-display);font-size:22px}
.done-banner svg{width:56px;height:56px;flex:none}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.dots i.on{background:var(--mission);border-color:var(--mission)}
.dots i.today{outline:2px solid var(--primary);outline-offset:1px}
.btn{border:0;border-radius:14px;background:var(--primary);color:var(--on-primary);padding:12px 18px;font-weight:700;min-height:48px}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.warn{background:var(--mission);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.nav>div{display:grid;grid-template-columns:repeat(7,1fr);width:100%;max-width:900px}
.nav button{border:0;background:none;padding:10px 1px 8px;font-size:13px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--primary);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr));gap:12px}
.grid>*{min-width:0}
.thumb{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--soft)}
.thumb.sq{aspect-ratio:1}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(64px,100%),1fr));gap:8px}
.wall>*{min-width:0}
.wall .st{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.wall svg{width:44px;height:44px}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;min-height:92px}
.item .e{font-size:32px;line-height:1.1}
.item.on{border-color:var(--primary);background:var(--soft)}
.item.lock{opacity:.45}
.stars{color:var(--praise);letter-spacing:2px}
.wcard{padding:0}.whead{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;cursor:pointer;min-height:48px}
.whead:focus-visible{outline:3px solid var(--primary);outline-offset:-3px;border-radius:16px}
.wth{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}

/* ---------- db helpers ---------- */
function enqueue(path,fn){var p=(Q[path]||Promise.resolve()).catch(function(){}).then(fn);Q[path]=p;return p}
function setDoc(path,data){return enqueue(path,function(){return DB.doc(path).set(data)}).catch(function(){toast('저장하지 못했어요. 잠시 뒤에 다시 해보세요.');throw 0}).catch(function(){})}

function subDoc(path,key){DB.doc(path).onSnapshot(function(s){S[key]=(s.exists&&s.data())||{};S.loaded[key]=true;sched()},function(){S.loaded[key]=true;sched()})}

/* ---------- firebase 저장소 ---------- */
var FB=null,FS=null,AUTH=null,FAM='',PC={},PP={},PX='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fbCfg(){try{return JSON.parse(lsGet('jion.cfg')||'null')}catch(e){return null}}
function famPath(p){return 'families/'+FAM+'/'+p}
function mkDB(){return{
  doc:function(p){var ref=FB.doc(FS,famPath(p));return{
    path:p,
    set:function(d){return FB.setDoc(ref,d)},
    delete:function(){return FB.deleteDoc(ref)},
    onSnapshot:function(cb,er){return FB.onSnapshot(ref,function(s){cb({exists:s.exists(),data:function(){return s.data()}})},er||function(){})}}},
  collection:function(p){var cref=FB.collection(FS,famPath(p));return{
    doc:function(){return {path:p+'/'+FB.doc(cref).id}},
    onSnapshot:function(cb,er){return FB.onSnapshot(cref,function(s){cb({docs:s.docs.map(function(d){return {id:d.id,data:function(){return d.data()}}})})},er||function(){})}}}
}}
function b64of(blob){return new Promise(function(res,rej){var r=new FileReader();
  r.onload=function(){var s=String(r.result);res(s.slice(s.indexOf(',')+1))};r.onerror=rej;r.readAsDataURL(blob)})}
var CH=700000;
function upload(blob,type){
  var mime=type||blob.type||'image/jpeg';
  return b64of(blob).then(function(b64){
    var id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),parts=[],i;
    for(i=0;i<b64.length;i+=CH)parts.push(b64.slice(i,i+CH));
    return Promise.all(parts.map(function(p,k){return FB.setDoc(FB.doc(FS,famPath('blobs/'+id+'_'+k)),{d:p})}))
      .then(function(){return FB.setDoc(FB.doc(FS,famPath('blobs/'+id)),{n:parts.length,type:mime,at:Date.now()})})
      .then(function(){PC[id]='data:'+mime+';base64,'+b64;return id})})}
function img(id){if(!id)return '';if(PC[id])return PC[id];if(!PP[id]){PP[id]=1;loadBlob(id)}return PX}
function loadBlob(id){
  if(!FS||!FAM)return;
  FB.getDoc(FB.doc(FS,famPath('blobs/'+id))).then(function(s){
    if(!s.exists())return;var m=s.data()||{},n=Math.max(1,+m.n||1),ps=[],i;
    for(i=0;i<n;i++)ps.push(FB.getDoc(FB.doc(FS,famPath('blobs/'+id+'_'+i))).then(function(x){return x.exists()?(x.data().d||''):''}));
    return Promise.all(ps).then(function(parts){
      var b64=parts.join('');if(!b64)return;
      PC[id]='data:'+(m.type||'image/jpeg')+';base64,'+b64;sched()})}).catch(function(){})}

/* ---------- 앱 안에서 바로 찍는 카메라 ---------- */
var CAMS=[];
function camHTML(id){
  return '<div id="'+id+'-cam" class="camwrap" hidden><video id="'+id+'-v" playsinline muted autoplay></video>'
   +'<div class="row" style="margin-top:8px"><button type="button" class="btn grow" id="'+id+'-shot">찰칵</button><button type="button" class="btn alt" id="'+id+'-cx">닫기</button></div></div>'
   +'<p class="small" id="'+id+'-hint" hidden style="color:var(--mission);margin:8px 0 0"></p>'}
function camBind(id,w,onBlob){
  var box=$('#'+id+'-cam',w),v=$('#'+id+'-v',w),hint=$('#'+id+'-hint',w),stream=null;
  function stop(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}if(box)box.hidden=true}
  CAMS.push(stop);
  $('#'+id+'-cx',w).addEventListener('click',stop);
  $('#'+id+'-shot',w).addEventListener('click',function(){
    if(!v.videoWidth){toast('잠깐만요, 카메라를 켜는 중이에요');return}
    var k=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');
    c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    c.toBlob(function(b){if(b)onBlob(b);stop()},'image/jpeg',.85)});
  return function(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return fallback();
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})
      .then(function(st){stream=st;v.srcObject=st;box.hidden=false;var p=v.play();if(p&&p.catch)p.catch(function(){})})
      .catch(fallback)};
  function fallback(){
    var fi=$('#'+id,w);if(fi)fi.click();
    if(hint){hint.hidden=false;hint.textContent='카메라를 바로 켤 수 없어요. 창이 안 뜨면 이 앱을 크롬 브라우저에서 열어 주세요.'}}}

/* ---------- photos ---------- */
function resize(file,max,type){return new Promise(function(res,rej){
  if(type&&type.indexOf('image')<0){res(file);return}
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,(max||1100)/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    var qs=[.78,.66,.55,.45,.35],i=0;
    (function step(){c.toBlob(function(b){
      if(!b){rej();return}
      if(b.size<=520000||i>=qs.length-1){res(b);return}
      i++;step()},'image/jpeg',qs[i])})()};
  im.onerror=function(){URL.revokeObjectURL(url);rej()};im.src=url})}

/* ---------- 칠한 글자 읽기 (사진 속 글자 → 문자) ---------- */
var TESS=null;
function loadTess(){
  if(TESS)return TESS;
  TESS=new Promise(function(res,rej){
    if(window.Tesseract)return res(window.Tesseract);
    var t=document.createElement('script');
    t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    t.onload=function(){window.Tesseract?res(window.Tesseract):rej()};
    t.onerror=function(){TESS=null;rej()};
    document.head.appendChild(t)});
  return TESS}
function strokeBox(strokes,W,H){
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,any=false;
  strokes.forEach(function(st){st.p.forEach(function(q){any=true;
    if(q[0]<x0)x0=q[0];if(q[0]>x1)x1=q[0];if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1]})});
  if(!any)return null;
  var pad=Math.max(10,(strokes[0].w||20)*0.9);
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W,x1+pad);y1=Math.min(H,y1+pad);
  if(x1-x0<8||y1-y0<8)return null;
  return {x:x0,y:y0,w:x1-x0,h:y1-y0}}
function cropForOcr(im,box){
  var target=Math.min(1600,Math.max(640,Math.round(box.w*3))),k=target/box.w;
  var c=document.createElement('canvas');
  c.width=Math.round(box.w*k);c.height=Math.round(box.h*k);
  var x=c.getContext('2d');
  x.imageSmoothingQuality='high';
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.drawImage(im,box.x,box.y,box.w,box.h,0,0,c.width,c.height);
  // 흑백 + 대비 올리기 (형광펜 색은 밝게 날림)
  var d=x.getImageData(0,0,c.width,c.height),a=d.data,i,g;
  for(i=0;i<a.length;i+=4){
    g=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
    g=g<110?0:g>175?255:Math.round((g-110)/65*255);
    a[i]=a[i+1]=a[i+2]=g}
  x.putImageData(d,0,0);
  return c}
function readStrokes(im,strokes,lang,onText){
  var box=strokeBox(strokes,im.naturalWidth,im.naturalHeight);
  if(!box){toast('먼저 단어를 칠해 주세요');return}
  toast('글자를 읽는 중이에요…');
  loadTess().then(function(T){
    return T.recognize(cropForOcr(im,box), lang==='ko'?'kor':'eng')
  }).then(function(r){
    var t=((r&&r.data&&r.data.text)||'').replace(/[|_~`^]/g,' ').replace(/\s+/g,' ').trim();
    if(!t){toast('글자를 못 읽었어요. 조금 더 크게 칠해 보세요.');return}
    onText(t);toast('읽었어요: '+t)
  }).catch(function(){toast('글자를 읽지 못했어요. 직접 써 주세요.')})}
function markerField(){
  if(!ASSETS)return '<p class="muted small">사진은 부모 계정으로 열었을 때만 올릴 수 있어요.</p>';
  var cols=[['#FFF176','노랑'],['#FF9ED2','분홍'],['#7FD8FF','하늘'],['#9BF29B','초록']];
  return '<div class="field"><span class="lab">또는 사진으로 찍어요</span><div class="row">'
   +'<button type="button" class="btn alt grow" id="wp-go">사진 찍기</button>'
   +'<label class="btn alt grow" style="text-align:center"><input type="file" class="vh" id="wpg" accept="image/*">앨범에서 고르기</label></div>'

function bindMarker(w,ph){

    ctx.globalCompositeOperation='source-over'}

function prepSec(p,label){
  if(!p||!p.items||!p.items.length)return '';
  var done=p.done||[],n=p.items.filter(function(it){return done.indexOf(it.id)>-1}).length;

  function save(dt){var old=prepOf(dt),done=(old&&old.done||[]).filter(function(x){return items.some(function(it){return it.id===x})});

   +'<button class="btn" id="ok">저장</button>',

     $('#padd',w).addEventListener('click',add);
     $('#pnew',w).addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();add()}});
     $('#prows',w).addEventListener('click',function(e){var b=e.target.closest('[data-pd]');if(!b)return;items.splice(+b.dataset.pd,1);refresh()});
     $('#pdd',w).addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(!b||b.classList.contains('on'))return;save(d);prepSheet(b.dataset.d)});

var TMR=null;
function mmss(s){return pad(Math.floor(s/60))+':'+pad(s%60)}
function timerSheet(){
  var P=[['양치',120],['책 읽기',900],['숙제',1200],['정리',600]],left=0,total=0;
  openSheet('집중 타이머',
   '<div class="tbig" id="tdisp" role="timer" aria-live="off">00:00</div><div class="bar" style="margin-bottom:12px"><i id="tbar" style="width:0%"></i></div>'
   +'<div class="grid" id="tpre" style="grid-template-columns:repeat(2,1fr);gap:8px">'+P.map(function(p){return '<button class="btn alt" data-s="'+p[1]+'">'+p[0]+' '+(p[1]/60)+'분</button>'}).join('')+'</div>'
   +'<div class="row" style="margin-top:10px"><input type="number" id="tmin" class="grow" min="1" max="90" inputmode="numeric" placeholder="직접 정하기 (분)"><button class="btn alt" id="tset">맞추기</button></div>'
   +'<div class="row" style="margin-top:12px"><button class="btn" id="tgo">시작</button><button class="btn alt" id="tstop">멈추기</button></div>'
   +'<div id="tdone" hidden style="text-align:center;margin-top:12px"><img src="char/m3.png" alt="" style="width:120px"><p style="margin:4px 0 0;font-family:var(--font-display);font-size:24px">다 했어요! 마루가 신났어요</p></div>',
   function(w){
     var disp=$('#tdisp',w),bar=$('#tbar',w);
     function stop(){if(TMR){clearInterval(TMR);TMR=null}}
     function paint(){disp.textContent=mmss(left);bar.style.width=(total?Math.round((total-left)/total*100):0)+'%'}
     function set(sec){stop();total=sec;left=sec;$('#tdone',w).hidden=true;paint()}
     function go(){if(!left||TMR)return;$('#tdone',w).hidden=true;
       TMR=setInterval(function(){left--;paint();
         if(left<=0){stop();$('#tdone',w).hidden=false;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}toast('타이머가 끝났어요!')}},1000)}
     $('#tpre',w).addEventListener('click',function(e){var b=e.target.closest('[data-s]');if(!b)return;set(+b.dataset.s);go()});
     $('#tset',w).addEventListener('click',function(){var m=Math.max(1,Math.min(90,+$('#tmin',w).value||0));set(m*60)});
     $('#tgo',w).addEventListener('click',go);
     $('#tstop',w).addEventListener('click',stop);
     paint()})}

/* ---------- 이달의 책 · 올해의 책 ---------- */
function curM(){return today().slice(0,7)}
function curY(){return today().slice(0,4)}
function bookOf(kind,period){return S.books.filter(function(b){return (kind==='m'?b.pickM:b.pickY)===period})[0]||null}
function pickTile(kind,b,period){
  var name=kind==='m'?'이달의 책':'올해의 책',when=kind==='m'?((+period.slice(5,7))+'월'):(period+'년');
  if(!b)return '<div class="pickbox empty-pick"><span class="pk">'+name+'</span><p class="muted small" style="margin:6px 0 0">'+when+' 책을 아직 안 뽑았어요.<br>책을 누르고 뽑아 보세요.</p></div>';
  return '<button class="pickbox" data-act="book" data-id="'+esc(b.id)+'"><span class="pk">'+name+'</span>'
   +(b.photo?'<img src="'+img(b.photo)+'" alt="">':'')
   +'<b>'+esc(b.title)+'</b><span class="stars">'+stars(b.rating)+'</span></button>'}
function pickCard(){
  if(!S.books.length)return '';
  return '<div class="card stack" style="gap:10px"><h2>지온이가 뽑은 책</h2>'
   +'<div class="picks">'+pickTile('m',bookOf('m',curM()),curM())+pickTile('y',bookOf('y',curY()),curY())+'</div></div>'}
function setPick(id,kind){
  var period=kind==='m'?curM():curY(),field=kind==='m'?'pickM':'pickY';
  var cur=bookOf(kind,period);
  if(cur&&cur.id===id){var c0=Object.assign({},cur);delete c0.id;c0[field]='';setDoc('books/'+id,c0);toast('뽑기를 취소했어요');return}
  if(cur){var c1=Object.assign({},cur);delete c1.id;c1[field]='';setDoc('books/'+cur.id,c1)}
  var b=S.books.filter(function(x){return x.id===id})[0];if(!b)return;
  var n=Object.assign({},b);delete n.id;n[field]=period;setDoc('books/'+id,n);
  popStamp('book',kind==='m'?'이달의 책!':'올해의 책!')}
function viewBooks(){
  var n=S.books.length,fo=S.folders.slice().sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0)});
  var chips='<button class="'+(S.bf==='all'?'on':'')+'" data-act="bf" data-k="all">전체</button>'+fo.map(function(f){return '<button class="'+(S.bf===f.id?'on':'')+'" data-act="bf" data-k="'+esc(f.id)+'">'+esc(f.name)+'</button>'}).join('')+'<button data-act="newFolder">+ 폴더</button>';
  var list=S.books.slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)}).filter(function(b){return S.bf==='all'||b.folder===S.bf});
  var tile=function(b){var f=fo.filter(function(x){return x.id===b.folder})[0];
    return '<button class="card bcard" data-act="book" data-id="'+esc(b.id)+'" style="text-align:left;padding:10px">'
     +(b.photo?'<img class="thumb" src="'+img(b.photo)+'" alt="">':'<div class="thumb" style="display:grid;place-items:center;font-family:var(--font-display);font-size:18px;padding:10px;text-align:center">'+esc(b.title)+'</div>')
     +'<div style="margin-top:8px;font-weight:700">'+esc(b.title)+'</div><div class="stars">'+stars(b.rating)+'</div>'
     +(b.pickY?'<span class="chip pick">👑 올해의 책</span>':'')+(b.pickM?'<span class="chip pick">⭐ '+(+String(b.pickM).slice(5,7))+'월의 책</span>':'')
     +(f?'<span class="chip">'+esc(f.name)+'</span>':'')+'</button>'};
  var groups=groupBy(list,S.bp,function(b){return b.date||ymd(new Date(b.createdAt||Date.now()))});
  var cards=groups.map(function(g){return '<div class="card"><h3 style="margin-bottom:10px">'+esc(g.label)+' <span class="small muted">'+g.items.length+'권</span></h3><div class="grid sm">'+g.items.map(tile).join('')+'</div></div>'}).join('');
  return '<div class="stack dictbg" style="padding:12px;background-image:linear-gradient(var(--veil),var(--veil)),'+maruPattern()+';background-size:auto,180px 180px;background-repeat:repeat"><div class="card stack" style="gap:10px"><div class="tl"><h2>독서 기록</h2><span class="s-book" style="font-family:var(--font-display);font-size:26px">'+esc(readTitle(n))+'</span></div>'
   +'<div class="row s-book">'+sBook().replace('<svg','<svg width="44" height="44"')+'<span style="font-family:var(--font-display);font-size:28px">독서왕 도장 '+n+'개</span></div>'
   +'<p class="muted small" style="margin:0">책 한 권을 별점과 소감과 함께 기록하면 도장이 하나 찍혀요.</p><button class="btn" data-act="addBook">읽은 책 기록하기</button></div>'
   +pickCard()
   +'<div class="seg">'+chips+'</div>'+periodSeg('bp',S.bp)
   +(cards||'<div class="empty">아직 기록한 책이 없어요.</div>')+'</div>'}

function ytId(u){
  var m=String(u||'').match(/(?:youtube\.com\/(?:watch\?[^#]*v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m?m[1]:''}
function ytBox(u){
  var id=ytId(u);if(!id)return '';
  return '<div class="ytwrap"><iframe src="https://www.youtube-nocookie.com/embed/'+esc(id)+'?rel=0&playsinline=1" title="노래" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>'}
function viewMusic(){
  var list=S.songs.slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
  var cards=list.map(function(s){
    return '<div class="card"><div class="tl"><h3>'+esc(s.title)+'</h3><span class="small muted">'+esc(fmtDate(s.date))+'</span></div>'
     +(s.audio?'<audio controls preload="none" src="'+img(s.audio)+'"></audio>':'')
     +(s.link?(ytId(s.link)?ytBox(s.link):'<p style="margin:8px 0 0"><a href="'+esc(s.link)+'" target="_blank" rel="noopener">노래 들으러 가기</a></p>'):'')
     +(s.memo?'<p style="white-space:pre-wrap;margin:8px 0 0">'+esc(s.memo)+'</p>':'')
     +(S.parent?'<div class="row" style="margin-top:8px"><button class="btn alt" data-act="editSong" data-id="'+esc(s.id)+'">고치기</button><button class="btn alt" data-act="delSong" data-id="'+esc(s.id)+'">지우기</button></div>':'')+'</div>'}).join('')||'<div class="empty">아빠가 만든 노래가 여기에 모여요.</div>';
  return '<div class="stack"><div class="card stack" style="gap:10px"><h2>지온이 뮤직박스</h2><p class="muted small" style="margin:0">아빠가 지온이를 위해 만든 노래들이에요.</p>'
   +(S.parent?'<button class="btn" data-act="addSong">노래 추가하기</button>':'')+'</div>'+cards+'</div>'}

function viewHeart(){
  var mood=S.moods.slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)}).slice(0,12);
  var reqs=S.reqs.slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)}).slice(0,15);
  var mh=mood.map(function(m){var mo=MOODS.filter(function(x){return x.k===m.mood})[0]||MOODS[1];
    return '<div class="card"><div class="row"><span style="font-size:34px">'+mo.e+'</span><div class="grow"><b>'+esc(mo.n)+'</b> <span class="small muted">'+esc(fmtDate(m.date))+'</span>'+(m.text?'<div>'+esc(m.text)+'</div>':'')+'</div>'
     +(S.parent&&!m.seen?'<span class="badge">새 글</span>':'')+'</div>'
     +(m.reply?'<div class="bubble"><span class="small muted">엄마·아빠 답장</span><br>'+esc(m.reply)+'</div>':'')
     +(S.parent?'<div class="row" style="margin-top:8px"><button class="btn alt" data-act="reply" data-c="moods" data-id="'+esc(m.id)+'">답장 쓰기</button>'+(m.seen?'':'<button class="btn alt" data-act="seen" data-c="moods" data-id="'+esc(m.id)+'">봤어요</button>')+'</div>':'')+'</div>'}).join('')||'<div class="empty">아직 마음 한마디가 없어요.</div>';
  var rh=reqs.map(function(r){
    return '<div class="card"><div class="tl"><span class="chip">'+esc(r.kind)+'</span><span class="small muted">'+esc(fmtDate(r.date))+'</span></div><p style="margin:6px 0 0">'+esc(r.text)+'</p>'
     +'<div class="small" style="margin-top:6px;color:'+(r.seen?'var(--book)':'var(--muted)')+'">'+(r.seen?'엄마·아빠가 확인했어요':'기다리는 중')+'</div>'
     +(r.reply?'<div class="bubble"><span class="small muted">엄마·아빠 답장</span><br>'+esc(r.reply)+'</div>':'')
     +(S.parent?'<div class="row" style="margin-top:8px"><button class="btn alt" data-act="reply" data-c="reqs" data-id="'+esc(r.id)+'">답장 쓰기</button>'+(r.seen?'':'<button class="btn alt" data-act="seen" data-c="reqs" data-id="'+esc(r.id)+'">확인했어요</button>')+'</div>':'')+'</div>'}).join('')||'<div class="empty">아직 보낸 부탁이 없어요.</div>';
  return '<div class="stack"><div class="card stack" style="gap:10px"><h2>오늘 내 마음</h2><button class="btn" data-act="moodNew">마음 한마디 남기기</button></div>'+mh
   +'<div class="card stack" style="gap:10px"><h2>부탁하기</h2><p class="muted small" style="margin:0">준비물이나 부탁을 엄마·아빠에게 보내요.</p><button class="btn" data-act="reqNew">부탁 보내기</button></div>'+rh+'</div>'}

function render(){
  var app=$('#app'),nav=$('#nav');
  var head0='<div class="top"><h1>지온의 하루</h1></div>';
  if(S.setup){app.innerHTML=head0+setupView();nav.innerHTML='';return}
  if(S.noDb){app.innerHTML=head0+'<div class="card empty"><h2>저장소에 연결하지 못했어요</h2><p>인터넷 연결을 확인하고 다시 열어 주세요.</p>'+(S.dbErr?'<p class="small muted">'+esc(S.dbErr)+'</p>':'')+'<button class="btn alt" data-act="cfgReset" style="margin-top:10px">저장소 설정 다시 넣기</button></div>';nav.innerHTML='';return}
  var ready=S.loaded.cfg&&S.loaded.tasks&&S.loaded.checks;
  var head='<div class="top"><h1>지온의 하루</h1><div class="row"><button class="pill" data-act="padOn">패드 화면</button><button class="pill'+(S.parent?' on':'')+'" data-act="parent">'+(S.parent?'부모 모드 끄기':'부모')+'</button>'+(S.parent?'<button class="pill" data-act="settings">설정</button>':'')+'</div></div>';
  var body;
  if(!ready){body='<div class="empty">'+(S.slow?'아직 불러오지 못했어요. 인터넷 연결을 확인해 주세요.':'불러오는 중이에요…')+'</div>'}
  else if(S.pad){app.innerHTML=viewPad();nav.innerHTML='';return}
  else body=S.tab==='praise'?viewPraise():S.tab==='words'?viewWords():S.tab==='books'?viewBooks():S.tab==='draw'?viewDraw():S.tab==='music'?viewMusic():S.tab==='heart'?viewHeart():viewHome();
  app.innerHTML=head+body;
  var ptn=$('#ptnew');
  if(ptn)ptn.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();A.ptAdd()}});
  var wqEl=$('#wq');
  if(wqEl)wqEl.addEventListener('input',function(){S.wq=wqEl.value;clearTimeout(window.__wqT);
    window.__wqT=setTimeout(function(){var pos=wqEl.selectionStart;render();var n=$('#wq');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},260)});
  syncWidget();
  nav.innerHTML='<div>'+TABS.map(function(t){return '<button class="'+(S.tab===t.k?'on':'')+'" data-act="tab" data-k="'+t.k+'" '+(S.tab===t.k?'aria-current="page"':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+t.i+'</svg>'+t.n+'</button>'}).join('')+'</div>'}

var A={
 close:function(){closeSheet()},
 tab:function(el){S.tab=el.dataset.k;render();window.scrollTo(0,0)},
 togW:function(el){var id=el.dataset.id;S.wo[id]=!S.wo[id];render()},
 wf:function(el){S.wf=el.dataset.k;render()},

 gp:function(el){S.gp=el.dataset.k;render()},
 bp:function(el){S.bp=el.dataset.k;render()},
 timer:function(){timerSheet()},
 prepEdit:function(){prepSheet(today())},
 schedEdit:function(){schedSheet(new Date().getDay())},

 ptWho:function(el){S.ptWho=el.dataset.k;render()},
 ptShow:function(){S.ptDone=!S.ptDone;render()},
 ptAdd:function(){var e=$('#ptnew');if(!e)return;var v=e.value.trim();

 cfgReset:function(){lsSet('jion.cfg','');lsSet('jion.fam','');location.reload()},

 msgClear:function(){var m=S.msg||{};setDoc('app/message',{text:'',date:m.date||today(),seen:false,at:Date.now()});toast('메시지를 지웠어요')},
 msgSeen:function(){var n=Object.assign({},S.msg||{});delete n.id;n.seen=true;setDoc('app/message',n);toast('읽음 표시를 보냈어요')},
 prepTog:function(el){var d=el.dataset.d,id=el.dataset.id,p=prepOf(d);if(!p)return;

 feed:function(){if(!snacks())return;var p=S.pet||{},n=(p.count||0)+1;
  var got=TRICKS.filter(function(t){return t.need===n})[0]||null;
  setDoc('app/pet',{count:n,last:today()});popPet(got)},
 trick:function(el){var t=TRICKS.filter(function(x){return x.id===el.dataset.id})[0];if(t)popTrick(t)},
 drawNew:function(){drawSheet(null)},
 drawEdit:function(el){drawSheet(el.dataset.id)},
 zoom:function(el){lightbox(el.dataset.src,el.dataset.cap,el.dataset.id)},
 bf:function(el){S.bf=el.dataset.k;render()},
 toggle:function(el){
  var id=el.dataset.id,d=today(),tc=todayCheck(),cur=(tc.done||[]).slice(),i=cur.indexOf(id);
  if(i>-1)cur.splice(i,1);else cur.push(id);
  var ids=activeTasks().map(function(t){return t.id}),done=cur.filter(function(x){return ids.indexOf(x)>-1});

   '<p class="muted small">'+(has?'숫자 4자리를 넣어 주세요.':'지온이가 부모 모드로 들어가지 못하게 숫자 4자리를 정해 주세요.')+'</p><div class="field"><input type="password" id="pin" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="비밀번호 4자리"></div><div id="perr" class="small" style="color:var(--mission);min-height:20px"></div><button class="btn" id="pinok">확인</button>',

      S.parent=true;closeSheet();render()}
    $('#pinok',w).addEventListener('click',go);inp.addEventListener('keydown',function(e){if(e.key==='Enter')go()})})},

  openSheet('칭찬 도장 찍기','<div class="field"><label for="r">무엇을 칭찬할까요?</label><textarea id="r" placeholder="예: 동생이랑 사이좋게 놀았어요"></textarea></div>'
   +'<p class="muted small" style="margin:0 0 10px">오늘 '+praiseToday()+'개 찍었어요. 하루에 여러 번 찍어도 돼요.</p>'
   +'<button class="btn" id="ok">도장 찍기</button>',function(w){
   $('#ok',w).addEventListener('click',function(){
     var d=today(),r=$('#r',w).value.trim();

function pickCfg(t){
  t=String(t||'');
  var i=t.indexOf('firebaseConfig'),start=-1;
  if(i>-1)start=t.indexOf('{',i);
  if(start<0)start=t.indexOf('{');
  if(start<0)return null;
  var d=0,end=-1,j,ch,q=0,prev='';
  for(j=start;j<t.length;j++){ch=t.charAt(j);
    if(q){if(ch===q&&prev!=='\\')q=0;prev=ch;continue}
    if(ch==='"'||ch==="'"||ch==='`'){q=ch;prev=ch;continue}
    if(ch==='{')d++;
    else if(ch==='}'){d--;if(d===0){end=j+1;break}}
    prev=ch}
  if(end<0)return null;
  var src=t.slice(start,end);
  try{return JSON.parse(src)}catch(e){}
  try{return (new Function('return ('+src+')'))()}catch(e){}
  return null}

  }catch(e){S.noDb=true;S.dbErr=String(e&&e.message||e);render();return}
  FB.signInAnonymously(AUTH).catch(function(e){S.authErr=String(e&&e.code||e);render()});
  try{if(window.AndroidBridge&&AndroidBridge.saveConfig)AndroidBridge.saveConfig(String(c.projectId||''),String(c.apiKey||''),String(FAM||''))}catch(e){}
  FB.onAuthStateChanged(AUTH,function(u){if(!u)return;if(DB)return;
    DB=mkDB();ASSETS={ok:true};
    var timer=setTimeout(function(){S.slow=true;render()},12000);
    subDoc('app/config','cfg');
    subCol('tasks','tasks');subCol('checks','checks');subCol('praise','praise');subCol('words','words');
    subCol('books','books');subCol('bookFolders','folders');subCol('songs','songs');subCol('requests','reqs');subCol('moods','moods');
    subCol('prep','prep');subCol('draws','draws');subDoc('app/pet','pet');subDoc('app/schedule','sched');subDoc('app/message','msg');subCol('ptasks','ptasks');
    var iv=setInterval(function(){if(S.loaded.cfg&&S.loaded.tasks&&S.loaded.checks){clearTimeout(timer);clearInterval(iv);render()}},300)})}
if(window.__FB)fbStart();else{window.addEventListener('fbready',fbStart);setTimeout(function(){if(!FB&&!S.setup){S.noDb=true;render()}},15000)}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
